[env:pico2]
; Community PlatformIO platform with current RP2350/Pico 2 support.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino

; Use the Earle Philhower Arduino-Pico core rather than the mbed-based core.
board_build.core = earlephilhower

lib_deps =
    adafruit/Adafruit MAX31855 library@^1.4.0

monitor_speed = 115200
